# magi on teravars: pre-merge review, competition when a task is worth one.
#
# **Only what is peculiar to this checkout lives here.** The roster, the seat
# assignment, the shape of a run and the update policy live in the machine
# layer (`<config_dir>/magi/config.toml`), because none of them are facts
# about this repository: they are facts about which agent CLIs are installed
# and what the operator is willing to spend. Stating them once there is the
# point of having layers, and it keeps this file to the things a different
# machine would still need to be told.
#
# What that leaves, and why each one has to be here:
#
# - `[verify]` runs `cargo`. A repository that is not Rust cannot inherit it,
#   and `gate` in particular has to match `.github/workflows/ci.yml` exactly:
#   a gate looser than CI is the one failure this whole setup cannot absorb —
#   a clean `magi run` that still turns into a red PR.
# - `[merge] base` names this repository's default branch, and is required at
#   all because of how this checkout is set up (see below).
# - `[prompts]` are this project's conventions.
#
# Note that an array may be declared in exactly one layer
# (`Config::refuse_split_arrays`). The roster (`[[agents]]`) and `[roles]`'s
# lists already live in the machine layer, so they must not be restated here
# — same reason `[graph]` and `[update]` stay there too: none of them are
# facts about this checkout.
#
# Rendered by teravars itself. Tera braces are live everywhere in this file,
# but comments are stripped before Tera sees them (teravars >= 0.2.2), so a
# comment may quote `{{ ... }}` freely.

[vars]
# Shared build cache for the verification commands. Override per machine with
# MAGI_CACHE. Lives beside its only consumer: `[vars]` is rendered per file,
# so a value used by this file's templates is stated in this file.
cache = "{{ env.MAGI_CACHE | default(value='/tmp') }}"

[verify]
# The real-machine leg, run in the winner's worktree once per review round;
# its output goes to the fixer.
#
# CARGO_TARGET_DIR is shared on purpose: each candidate worktree would
# otherwise compile this crate from scratch, which is by far the slowest
# thing in a review round on a Rust repo. Only the winner's worktree runs
# these commands, and only one at a time, so nothing contends on cargo's lock.
e2e = ["CARGO_TARGET_DIR={{ vars.cache }}/teravars-target cargo test --locked --all-targets"]
# The final gate before merge. Must match the set `.github/workflows/ci.yml`
# runs. `Makefile.toml`'s `[tasks.check]` already advertises itself as "same
# as CI" and lists its dependencies as editorconfig-check + fmt-check +
# clippy + test + lock-check, which line up with ci.yml's editorconfig / fmt
# / clippy / test / lockfile jobs (lock-check's `cargo check --locked
# --all-targets` also covers the plain `check` job, since anything that
# compiles --locked also compiles unlocked).
#
# `[tasks.editorconfig-check]` itself degrades to a no-op when the
# `editorconfig-checker` binary isn't on the gate machine's PATH ("skipped
# locally ... still enforced in CI", per its own description), while
# ci.yml's `editorconfig` job always installs and runs it. `cargo make
# check` alone would silently inherit that soft-skip, so a gate machine
# without the binary would pass a `.editorconfig` violation that CI rejects
# — exactly the "clean magi run, red PR" failure this file exists to
# prevent. Running `editorconfig-checker` directly first turns a missing
# binary into a hard gate failure instead of a silent skip.
#
# ci.yml's `coverage` job (cargo llvm-cov + Codecov upload) is deliberately
# left out: it uploads to an external service and is explicitly configured
# not to fail the build (`fail_ci_if_error: false`), so it can never turn a
# clean magi run into a red PR — the one thing this gate has to prevent.
gate = [
  "editorconfig-checker",
  "CARGO_TARGET_DIR={{ vars.cache }}/teravars-target cargo make check",
]

[merge]
mode = "none"
# Required here, and in every jj-colocated repo: jj keeps git's HEAD detached
# at the working-copy commit, so magi cannot infer the base branch from
# `git symbolic-ref HEAD`.
base = "main"

# Project conventions appended to the node prompts, never merged into them.
# Repository-wide context lives in AGENTS.md, which every agent already reads
# from the checkout; these are the things a magi *node* needs to know.
[prompts]
all = """
This repository uses jj (Jujutsu) with a colocated git repo. `git commit` works \
in a candidate worktree and is what magi expects, but never run `jj` commands \
and never touch the main working copy.
teravars is a library: prefer an additive API change over a breaking one, and \
when breaking is unavoidable, say which consumer it breaks (renri today; yui, \
rvpm, todoke, shun, spyrun are queued in ROADMAP.md).
Features gate the test surface: `merge` and `shell` are off by default, so the \
automated `verify.e2e` / `verify.gate` legs never exercise `tests/merge.rs` or \
the shell helpers. Run `cargo test --all-features` by hand when touching either.
"""
review = """
Formatting is not a finding: `cargo fmt` runs in the gate. Spend the round on \
correctness of the text scanners (`extract_vars`, `strip_toml_comments`, \
`strip_tera_blocks`), on TOML/Tera edge cases they claim to handle, and on \
whether an error is surfaced with its real cause instead of tera's bare \
`__tera_one_off` message.
A silent corruption is worse than a loud failure here: the library rewrites \
config text, so a scanner that mis-parses and drops bytes must be treated as \
more serious than one that errors out.
"""
